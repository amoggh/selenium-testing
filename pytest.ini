[pytest]
testpaths = tests
addopts = -v --html=reports/report.html --self-contained-html
markers =
    positive: Positive functional tests validating standard user flows
    negative: Negative tests asserting proper handling of invalid inputs and errors
    boundary: Boundary value and robustness tests
    smoke: Critical smoke tests for core workflows
    login: Authentication and login test suite
    cart: Shopping cart interaction test suite
    checkout: Checkout and order completion test suite
